spring.application.name=Spring-ChatBot-demo

#spring.datasource.url=jdbc:postgresql://localhost:5432/chatbotdb
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile

# Embeddings via Groq (nomic-embed-text-v1.5, 768 dimensiones)
spring.ai.openai.embedding.options.model=nomic-embed-text-v1.5

# pgvector — crea tabla vector_store automaticamente al arrancar
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

logging.level.org.springframework.security=DEBUG

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.error.include-message=always
server.error.include-exception=true

logging.file.name=logs/spring-boot.log
logging.logback.rollingpolicy.max-file-size=10MB